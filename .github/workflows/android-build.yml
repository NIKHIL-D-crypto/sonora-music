
name: Build Sonora Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-build
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js \
            icon-192.png icon-512.png www/

      - name: Add Android platform
        run: npx cap add android

      - name: Inject native media service
        run: |
          D=android/app/src/main/java/com/nikhildcrypto/sonora
          cp native/*.java $D/
          cat > $D/MainActivity.java <<'EOF'
          package com.nikhildcrypto.sonora;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              registerPlugin(SonoraNativeMediaPlugin.class);
              super.onCreate(b);
            }
          }
          EOF
          sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application|; s|</application>|<service android:name=".SonoraPlaybackService" android:exported="true" android:foregroundServiceType="mediaPlayback"><intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter></service></application>|' android/app/src/main/AndroidManifest.xml
          printf "\ndependencies { implementation 'androidx.media3:media3-session:1.5.1' }\n" >> android/app/build.gradle

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
